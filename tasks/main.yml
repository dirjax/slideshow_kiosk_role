---

- name: Install kiosk packages
  ansible.builtin.apt:
    name:
      - openbox
      - xserver-xorg-core
      - xauth
      - x11-utils
      - feh
      - imagemagick
      - libheif1
      - xprintidle
      - unclutter
      - chromium
      - cifs-utils
    state: present
    update_cache: true

- name: Create kiosk user
  ansible.builtin.user:
    name: "{{ kiosk_user }}"
    shell: /bin/bash
    create_home: true

- name: Ensure required directories exists
  ansible.builtin.file:
    path: "/home/{{ kiosk_user }}/{{ directories }}"
    state: directory
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
  loop:
    - ".config/openbox"
    - "{{ kiosk_slideshow_image_dir }}" 
  loop_control:
    loop_var: directories
  tags: [kiosk, feh]

- name: Deploy Openbox configuration
  ansible.builtin.copy:
    src: rc.xml
    dest: "/home/{{ kiosk_user }}/.config/openbox/rc.xml"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
  notify: Restart kiosk X session

- name: Configure shell autologin for X
  ansible.builtin.copy:
    content: |
      # Auto-start X if not already running
      if [[ -z "$DISPLAY" ]] && [[ "$XDG_VTNR" -eq 1 ]]; then
        exec startx -- :0 vt7
      fi
    dest: "/home/{{ kiosk_user }}/.bash_login"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
  notify: Restart kiosk X session

- name: Deploy X initialization script
  ansible.builtin.template:
    src: xinitrc.j2
    dest: "/home/{{ kiosk_user }}/.xinitrc"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
  notify: Restart kiosk X session

- name: Deploy feh screensaver script
  ansible.builtin.template:
    src: feh-screensaver.sh.j2
    dest: "/home/{{ kiosk_user }}/feh-screensaver.sh"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
  notify: Restart kiosk X session
  tags: [feh]

- name: Samba sync setup
  when: kiosk_samba_enabled
  block:
    - name: Create samba mount point
      ansible.builtin.file:
        path: "{{ kiosk_samba_mount_point }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy samba sync script
      ansible.builtin.template:
        src: kiosk_samba_sync.sh.j2
        dest: /usr/local/bin/kiosk_samba_sync.sh
        owner: root
        group: root
        mode: "0755"

    - name: Schedule samba sync cron job
      ansible.builtin.template:
        src: kiosk-samba-sync.cron.j2
        dest: /etc/cron.d/kiosk-samba-sync
        owner: root
        group: root
        mode: "0640"
  tags: [samba]

- name: Remove samba sync cron job
  ansible.builtin.file:
    path: /etc/cron.d/kiosk-samba-sync
    state: absent
  when: not kiosk_samba_enabled
  tags: [samba]