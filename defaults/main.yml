---
kiosk_user: kiosk
kiosk_chromium_url: "https://xkcd.com/"
kiosk_idle_ms: 60000
kiosk_slideshow_delay: 120
kiosk_chromium_enabled: false

kiosk_slideshow_orientation: "all" # Options: "landscape", "portrait", "all"
kiosk_slideshow_filelist: "/home/{{ kiosk_user }}/feh-screensaver.filelist"
kiosk_slideshow_image_dir: "/home/{{ kiosk_user }}/Pictures"

kiosk_samba_enabled: false
kiosk_samba_share: ""
kiosk_samba_mount_point: /mnt/kiosk-smb
kiosk_samba_sync_schedule: "*/6 * * * *"
kiosk_samba_rsync_options: "-av --delete-after"
